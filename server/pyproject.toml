[project]
name = "soulsync-server"
version = "0.2.0"
description = "SoulSync — multimodal emotional companion agent server"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.24",
    "sqlite-vec>=0.1.3",
    "psutil>=5.9",
]

[project.optional-dependencies]
perception = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
    "soundfile>=0.12",
    "librosa>=0.10",
]
llm-local = [
    "openai>=1.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
